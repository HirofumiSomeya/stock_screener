name: Daily Stock Screener & AI Predictor

on:
  schedule:
    # JSTの月〜金 17:00（UTCの 08:00）に自動実行
    - cron: '0 8 * * 1-5'
  
  # GitHubの画面から手動でも実行できるようにするボタンを追加
  workflow_dispatch: 

jobs:
  run-screener:
    runs-on: ubuntu-latest

    # ↓ ここにリポジトリへの書き込み権限を追加
    permissions:
      contents: write

    steps:
    # 1. リポジトリのコードをチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Python環境のセットアップ
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 必要なライブラリのインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade yfinance pandas numpy lightgbm scikit-learn tqdm requests openpyxl

    # 4. スクリプトの実行（ファイル名を main.py と仮定しています）
    - name: Run Python Script
      run: python main.py

    # 5. 生成された履歴やCSVファイルを自動でGitに保存（オプション）
    - name: Commit and push updated history
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ai_prediction_history.csv ai_ranking_with_prices.csv || true
        git commit -m "Auto-update AI prediction history [skip ci]" || true
        git push || true

    # 6. 【追加】検証レポートとランキング結果をメールで通知
    - name: Send Email Notification
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.MAIL_ADDRESS }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "📊 【AI株価予測】本日の有望銘柄ランキング＆答え合わせレポート"
        to: ${{ secrets.MAIL_ADDRESS }}
        from: "AI Stock Screener <${{ secrets.MAIL_ADDRESS }}>"
        body: file://prediction_report.md
        convert_markdown: true
        attachments: ai_ranking_with_prices.csv,ai_prediction_history.csv